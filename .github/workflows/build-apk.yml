name: Build Android APK

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 سحب ملفات الموقع
        uses: actions/checkout@v4

      - name: ⚙️ إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ إعداد بيئة Java 21 للأندرويد
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🏗️ تحويل الموقع لتطبيق أندرويد أصلي (Capacitor)
        run: |
          # 1. تجميع كل ملفات الموقع في مجلد واحد
          mkdir www
          rsync -av --exclude='www' --exclude='.git' --exclude='.github' ./ ./www/
          
          # 2. تثبيت مكتبات Capacitor وتغليف التطبيق
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Anjum Green" "com.anjumgreen.pharmacy" --web-dir "www"
          
          # 3. إضافة منصة أندرويد ودمج الملفات
          npx cap add android
          npx cap copy android
          
          # 💡 الحل السحري: إجبار النظام على استخدام إصدار Kotlin موحد لمنع تعارض (Duplicate class)
          echo "subprojects { project.configurations.all { resolutionStrategy.eachDependency { details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.9.22' } } } }" >> android/build.gradle
          
          # 4. بناء ملف الـ APK النهائي
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 🚀 رفع ملف الـ APK الجاهز للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Anjum-Green-Pharmacy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
