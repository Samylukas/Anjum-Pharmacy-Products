name: Build Android APK

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 سحب ملفات الموقع
        uses: actions/checkout@v4

      - name: ⚙️ إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ إعداد بيئة Java 17 المستقرة
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗️ تحويل الموقع لتطبيق أندرويد (Capacitor v5)
        run: |
          mkdir www
          rsync -av --exclude='www' --exclude='.git' --exclude='.github' ./ ./www/
          
          npm init -y
          # استخدام الإصدار الخامس المستقر لمنع أي تعارض في البناء
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          npx cap init "Anjum Green" "com.anjumgreen.pharmacy" --web-dir "www"
          
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 🚀 رفع ملف الـ APK الجاهز للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Anjum-Green-Pharmacy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
