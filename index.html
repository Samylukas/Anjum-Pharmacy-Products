<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anjum Green Pharmacy</title>
    <!-- استدعاء Tailwind CSS لتصميم عصري وسريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء مكتبة قراءة ملفات الـ CSV من الجوجل شيت -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        /* تأثيرات حركية ناعمة */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- شاشة اختيار اللغة (تظهر أولاً) -->
    <div id="language-modal" class="fixed inset-0 bg-green-900 bg-opacity-95 z-50 flex items-center justify-center fade-in">
        <div class="text-center w-full px-4">
            <h1 class="text-white text-4xl md:text-5xl font-bold mb-4">🌿 Anjum Green Pharmacy</h1>
            <p class="text-green-200 mb-8 text-lg">Please select your preferred language</p>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-3xl mx-auto">
                <!-- أزرار اللغات -->
                <button onclick="setLanguage('EN')" class="bg-white text-green-800 py-3 rounded-xl font-bold hover:bg-green-500 hover:text-white transition shadow-lg">🇬🇧 English</button>
                <button onclick="setLanguage('AR')" class="bg-white text-green-800 py-3 rounded-xl font-bold hover:bg-green-500 hover:text-white transition shadow-lg">🇪🇬 العربية</button>
                <button onclick="setLanguage('PL')" class="bg-white text-green-800 py-3 rounded-xl font-bold hover:bg-green-500 hover:text-white transition shadow-lg">🇵🇱 Polski</button>
                <button onclick="setLanguage('RU')" class="bg-white text-green-800 py-3 rounded-xl font-bold hover:bg-green-500 hover:text-white transition shadow-lg">🇷🇺 Русский</button>
                <button onclick="setLanguage('CS')" class="bg-white text-green-800 py-3 rounded-xl font-bold hover:bg-green-500 hover:text-white transition shadow-lg">🇨🇿 Čeština</button>
                <button onclick="setLanguage('DE')" class="bg-white text-green-800 py-3 rounded-xl font-bold hover:bg-green-500 hover:text-white transition shadow-lg">🇩🇪 Deutsch</button>
                <button onclick="setLanguage('IT')" class="bg-white text-green-800 py-3 rounded-xl font-bold hover:bg-green-500 hover:text-white transition shadow-lg">🇮🇹 Italiano</button>
            </div>
        </div>
    </div>

    <!-- الشريط العلوي للموقع (Navbar) -->
    <nav class="bg-white shadow-md p-4 sticky top-0 z-40 hidden" id="main-nav">
        <div class="container mx-auto flex justify-between items-center">
            <div class="text-2xl font-extrabold text-green-600 flex items-center gap-2">
                🌿 <span id="brand-name">Anjum Pharmacy</span>
            </div>
            <div class="flex gap-4 items-center">
                <!-- أيقونة السلة -->
                <button class="bg-green-100 text-green-700 px-4 py-2 rounded-lg font-bold hover:bg-green-200 transition">
                    🛒 <span id="cart-count">0</span>
                </button>
                <!-- زر تغيير اللغة -->
                <button onclick="showLanguageSelector()" class="text-2xl hover:scale-110 transition">🌐</button>
            </div>
        </div>
    </nav>

    <!-- مساحة عرض المنتجات والعروض -->
    <main class="container mx-auto p-4 mt-8 hidden" id="main-content">
        <!-- قسم العروض (Packages) -->
        <h2 id="packages-title" class="text-3xl font-bold mb-6 border-l-4 border-green-500 pl-3">🎁 Special Packages</h2>
        <div id="packages-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
            <!-- سيتم إضافة العروض هنا برمجياً -->
        </div>

        <!-- قسم المنتجات (Products) -->
        <h2 id="products-title" class="text-3xl font-bold mb-6 border-l-4 border-green-500 pl-3">💊 Our Products</h2>
        <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- سيتم إضافة المنتجات هنا برمجياً -->
            <div class="col-span-full text-center py-10 text-gray-500 text-xl" id="loading-text">
                Loading... جاري التحميل...
            </div>
        </div>
    </main>

    <!-- ملف الجافاسكريبت الذي سيقوم بتشغيل الموقع -->
    <script src="app.js"></script>
</body>
</html>
