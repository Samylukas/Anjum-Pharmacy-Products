<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anjum Green Pharmacy</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <script>window.TAILWIND_DISABLE_TOUCH = true;</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'Tajawal', 'sans-serif'], },
                    colors: {
                        navyDark: '#0f172a', brandOrange: '#f97316', brandGreen: '#10b981', oliveGreen: '#2e7d32'
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', 'Tajawal', sans-serif; scroll-behavior: smooth; }
        
        @keyframes cinematicZoom {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; filter: blur(10px); }
            50% { transform: scale(1.1) rotate(2deg); opacity: 0.9; filter: blur(0px); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 35px rgba(249, 115, 22, 0.2); }
            50% { box-shadow: 0 0 60px rgba(16, 185, 129, 0.4); }
        }
        @keyframes smokeExit { 0% { transform: scale(1); opacity: 1; filter: blur(0px); } 100% { transform: scale(3.5); opacity: 0; filter: blur(25px); } }

        @keyframes floatWord {
            0% { transform: translateY(10px) scale(0.9); opacity: 0; }
            50% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-5px) scale(0.95); opacity: 0.8; }
        }
        .word-cloud-item { animation: floatWord 2.5s ease-in-out infinite alternate; }
        .delay-1 { animation-delay: 0.2s; } .delay-2 { animation-delay: 0.5s; } .delay-3 { animation-delay: 0.8s; } .delay-4 { animation-delay: 1.1s; } .delay-5 { animation-delay: 1.4s; }

        .splash-logo-animated { animation: cinematicZoom 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards, pulseGlow 3s infinite; }
        .smoke-exit-active { animation: smokeExit 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards !important; pointer-events: none; }
        
        .glass-modal { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- IMAGE LIGHTBOX -->
    <div id="image-lightbox" class="fixed inset-0 z-[100] bg-slate-900/90 backdrop-blur-md hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300" onclick="closeLightbox()">
        <button class="absolute top-6 right-6 text-white bg-white/20 hover:bg-white/40 w-12 h-12 rounded-full flex items-center justify-center text-2xl font-bold transition backdrop-blur-md">✕</button>
        <img id="lightbox-img" src="" class="max-w-full max-h-[90vh] object-contain rounded-2xl shadow-2xl transform scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
    </div>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center p-6 text-center transition-opacity duration-700">
        <div id="splash-logo-container" class="relative w-72 h-72 md:w-80 md:h-80 mb-6 rounded-3xl overflow-hidden shadow-2xl border-2 border-slate-100 splash-logo-animated flex items-center justify-center bg-white p-3">
            <img src="logo.png" alt="Anjum Green Pharmacy" class="w-full h-full object-contain rounded-2xl" onerror="this.onerror=null; this.src='logo.jpeg';">
        </div>
        
        <div id="splash-text-container" class="relative mt-4 flex flex-wrap justify-center items-center max-w-2xl gap-x-6 gap-y-3">
            <span class="word-cloud-item text-5xl font-extrabold text-navyDark delay-1">أهلاً بكم</span>
            <span class="word-cloud-item text-3xl font-semibold text-brandOrange delay-3">Welcome</span>
            <span class="word-cloud-item text-4xl font-bold text-emerald-600 delay-2">Willkommen</span>
            <span class="word-cloud-item text-2xl font-medium text-slate-600 delay-5">Benvenuto</span>
            <span class="word-cloud-item text-3xl font-bold text-sky-600 delay-4">Добро пожаловать</span>
            <span class="word-cloud-item text-2xl font-semibold text-rose-500 delay-2">Witamy</span>
            <span class="word-cloud-item text-4xl font-bold text
